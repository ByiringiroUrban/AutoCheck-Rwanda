services:
  - type: web
    name: autocheck-rwanda-api
    runtime: python
    buildCommand: "pip install -r requirements.txt && prisma generate --schema=prisma/schema.prisma"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.1
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: CORS_ORIGINS
        value: '["https://autocheckrwanda.vercel.app","http://localhost:3000","http://localhost:5173"]'
      - key: AI_MODEL_VERSION
        value: "autocheck-vision-v1.0"
      - key: AI_CONFIDENCE_THRESHOLD
        value: "0.60"
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"
